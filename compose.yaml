name: campusclaw-gd
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=64M"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      DB_ADDR: db:3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:?}
      SEED_STUDENT_A_PASSWORD: ${SEED_STUDENT_A_PASSWORD:?}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:?}
      SEED_STUDENT_B_PASSWORD: ${SEED_STUDENT_B_PASSWORD:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
      DEV_ORIGIN: ${DEV_ORIGIN:-http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/campusclaw", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 4s
      retries: 3
    restart: unless-stopped
volumes:
  mysql-data:
