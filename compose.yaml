name: campusclaw-gd
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=64M", "--ngram-token-size=2"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-course-embedding}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-course-chat}
      QDRANT_URL: http://qdrant:6333
      DB_ADDR: db:3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:?}
      SEED_STUDENT_A_PASSWORD: ${SEED_STUDENT_A_PASSWORD:?}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:?}
      SEED_STUDENT_B_PASSWORD: ${SEED_STUDENT_B_PASSWORD:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
      DEV_ORIGIN: ${DEV_ORIGIN:-http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/campusclaw", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 4s
      retries: 3
    restart: unless-stopped
  apitest:
    profiles: [test]
    build:
      context: .
      dockerfile: apitest/Dockerfile
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
      APITEST_BASE_URL: http://nginx
      APITEST_DB_HOST: db
      APITEST_QDRANT_URL: http://qdrant:6333
      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:?}
      SEED_STUDENT_A_PASSWORD: ${SEED_STUDENT_A_PASSWORD:?}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:?}
      SEED_STUDENT_B_PASSWORD: ${SEED_STUDENT_B_PASSWORD:?}
    volumes:
      - ./apitest/reports:/work/apitest/reports
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  mysql-data:
  qdrant-data:
