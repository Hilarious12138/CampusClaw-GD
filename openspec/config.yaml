schema: spec-driven
context: |
  CampusClaw-GD；第 3 课实现保留于 changes/establish-campus-knowledge-access,尚未归档。
  当前认证 change：replace-session-with-bearer-jwt 已授权实施；add-traceable-vector-retrieval 已获用户授权实施（2026-09-30）。
  技术栈：React 18 + TypeScript + Vite；Go net/http；MySQL 8.0；Nginx + Compose。
  本次实现：MySQL knowledge_chunks 存正文，Qdrant 存向量和标识；嵌入 course-embedding、2048 维、课程 /v1 网关嵌入实测通过；对话 course-chat 使用同一网关与凭证，密钥仅本机 .env。
  浏览器只用同源 /api→Nginx→Go；MySQL、Qdrant、嵌入服务仅由后端访问，密钥仅服务端环境变量。
  登录、角色、上传及文件鉴权复用；检索班级只取JWT 验证后从数据库成员关系解析的 class_id，不信任客户端班级编号。
  第四课三模式 keyword/vector/hybrid，默认 hybrid；第四课 /api/ask 无依据不调用生成。第五课流式会话无依据仍调用模型，但 citations 为空且去除虚构引用编号。
  已核对用户指定第 4 课网站全部章节；原 week04 spec 未取得。支持 auto 800/80、custom、hierarchy 及教师重建；第 4 课不做流式/长对话、作业、注册或额外文件解析。
  第 5 课 add-guided-streaming-conversations 已获用户授权实施（2026-10-14）：教师维护多个本班智能体及其提示词、技能/材料绑定；个人流式会话、Swagger 和 apitest；不扩展笔记/收藏。
  按需只读当前变更和相关旧规约，正文中文，保留英文 OpenSpec 骨架，不增加重复文档。
rules:
  proposal:
    - 明确 Why、What Changes、Capabilities、Non-goals，以及待确认范围。
  specs:
    - 使用 ADDED Requirements / Requirement / Scenario；每条需求含可判定场景，覆盖成功、隔离、无命中和故障。
  design:
    - 概览包含技术栈、接口与数据模型、数据流、失败边界和验证方式；开发前与用户敲定。
  tasks:
    - 按本次变更阶段组织，每条包含 verify；规划阶段 checkbox 全部未勾选，实施及验证通过后才勾选。
