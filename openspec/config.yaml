schema: spec-driven
context: |
  CampusClaw-GD；第 3 课实现保留于 changes/establish-campus-knowledge-access，尚未归档。
  当前 change：add-traceable-vector-retrieval，仅文档规划，禁止 Apply；收到明确开发授权后才实施。
  技术栈：React 18 + TypeScript + Vite；Go net/http；MySQL 8.0；Nginx + Compose。
  新规划：MySQL knowledge_chunks 存正文，Qdrant 存向量和标识；嵌入与对话课程网关的具体配置待提供。
  浏览器只用同源 /api→Nginx→Go；MySQL、Qdrant、嵌入服务仅由后端访问，密钥仅服务端环境变量。
  登录、角色、上传及文件鉴权复用；检索班级只取认证后的会话 class_id，不信任客户端班级编号。
  三模式 keyword/vector/hybrid，默认 hybrid；无依据返回空 hits/citations 且不调用生成；有依据才做非流式简短问答并校验引用。
  已核对用户指定第 4 课网站全部章节；原 week04 spec 未取得。支持 auto 800/80、custom、hierarchy 及教师重建；不做流式/长对话、作业、注册或额外文件解析。
  按需只读当前变更和相关旧规约，正文中文，保留英文 OpenSpec 骨架，不增加重复文档。
rules:
  proposal:
    - 明确 Why、What Changes、Capabilities、Non-goals，以及待确认范围。
  specs:
    - 使用 ADDED Requirements / Requirement / Scenario；每条需求含可判定场景，覆盖成功、隔离、无命中和故障。
  design:
    - 概览包含技术栈、接口与数据模型、数据流、失败边界和验证方式；开发前与用户敲定。
  tasks:
    - 按本次变更阶段组织，每条包含 verify；规划阶段 checkbox 全部未勾选，实施及验证通过后才勾选。
