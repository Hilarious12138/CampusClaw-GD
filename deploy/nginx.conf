server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $api http://api:8080;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Cache-Control no-store always;
 location ^~ /uploads { return 404; }
 location = /_ready {
  internal;
  proxy_pass $api/health;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_connect_timeout 2s;
  proxy_read_timeout 3s;
 }
 location = /_auth {
  internal;
  proxy_pass $api/api/page-auth;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_connect_timeout 2s;
  proxy_read_timeout 3s;
 }
 location /api/ {
  proxy_pass $api$request_uri;
  proxy_set_header Host $host;
  proxy_connect_timeout 2s;
  proxy_read_timeout 20s;
  proxy_intercept_errors on;
  error_page 502 504 =503 @api_unavailable;
 }
 location = /health {
  proxy_pass $api/health;
  proxy_connect_timeout 2s;
  proxy_read_timeout 3s;
  proxy_intercept_errors on;
  error_page 502 504 =503 @api_unavailable;
 }
 location @api_unavailable { default_type application/json; return 503 '{"error":{"message":"服务暂时不可用，请稍后刷新。"}}'; }
 location = /login {
  auth_request /_ready;
  error_page 500 502 503 504 =503 @unavailable;
  try_files /index.html =404;
 }
 location /assets/ {
  auth_request /_ready;
  error_page 500 502 503 504 =503 @unavailable;
  try_files $uri =404;
 }
 location / {
  auth_request /_auth;
  error_page 401 =302 /login;
  error_page 500 502 503 504 =503 @unavailable;
  try_files $uri /index.html;
 }
 location @unavailable { default_type text/html; return 503 '<!doctype html><meta charset="utf-8"><title>CampusClaw</title><h1>服务暂时不可用</h1><p>请稍后刷新页面。</p>'; }
}
