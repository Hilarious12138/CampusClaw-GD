log_format campus_access '$remote_addr - $request_method $uri $status';
access_log /var/log/nginx/access.log campus_access;
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $api http://api:8080;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Cache-Control no-store always;
 location = /openapi.json { proxy_pass $api/openapi.json; proxy_read_timeout 3s; }
 location = /swagger { return 302 /swagger/; }
 location ^~ /swagger/ { try_files $uri $uri/ =404; }
 location ^~ /uploads { return 404; }
 location = /_ready {
  internal;
  proxy_pass $api/health;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_connect_timeout 2s;
  proxy_read_timeout 3s;
 }
 location ~ "^/api/conversations/[0-9a-f]{32}/messages$" {
  proxy_pass $api$request_uri;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  gzip off;
  proxy_connect_timeout 2s;
  proxy_read_timeout 150s;
  proxy_intercept_errors off;
 }
 location /api/ {
  proxy_pass $api$request_uri;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_connect_timeout 2s;
  proxy_read_timeout 90s;
  proxy_intercept_errors on;
  error_page 502 504 =503 @api_unavailable;
 }
 location = /health {
  proxy_pass $api/health;
  proxy_connect_timeout 2s;
  proxy_read_timeout 3s;
  proxy_intercept_errors on;
  error_page 502 504 =503 @api_unavailable;
 }
 location @api_unavailable { default_type application/json; return 503 '{"error":{"message":"服务暂时不可用，请稍后刷新。"}}'; }
 location = /login {
  auth_request /_ready;
  error_page 500 502 503 504 =503 @unavailable;
  try_files /index.html =404;
 }
 location /assets/ {
  auth_request /_ready;
  error_page 500 502 503 504 =503 @unavailable;
  try_files $uri =404;
 }
 location / {
  auth_request /_ready;
  error_page 500 502 503 504 =503 @unavailable;
  try_files $uri /index.html;
 }
 location @unavailable { default_type text/html; return 503 '<!doctype html><meta charset="utf-8"><title>CampusClaw</title><h1>服务暂时不可用</h1><p>请稍后刷新页面。</p>'; }
}
